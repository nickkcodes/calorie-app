<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Calorie Tracker</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div class="app">

            <div class="slider" id="slider">

                <div class="page" id="page-calories">
                    <h1>Calories</h1>

                    <div class="circle-container">
                        <svg viewBox="0 0 200 200" class="circle-svg">
                            <circle class="circle-bg" cx="100" cy="100" r="80"/>
                            <circle class="circle-fill" cx="100" cy="100" r="80" id="calorie-ring"/>
                        </svg>
                        <div class="circle-text">
                            <span id="calories-eaten">0</span>
                            <small>of <span id="calorie-goal">2000</span> kcal</small>
                        </div>
                    </div>

                    <div class="log-section">
                        <h2>Today's Log</h2>

                        <div class="meal" id="meal-breakfast">
                            <div class="meal-header" onclick="toggleMeal('breakfast')">
                                <span>🌅 Breakfast</span>
                                <span class="meal-kcal" id="kcal-breakfast">0 kcal</span>
                                <span class="meal-arrow" id="arrow-breakfast">▼</span>
                            </div>
                        <ul class="meal-list" id="list-breakfast"></ul>
                    </div>

                    <div class="meal" id="meal-lunch">
                        <div class="meal-header" onclick="toggleMeal('lunch')">
                            <span>🌞 Lunch</span>
                            <span class="meal-kcal" id="kcal-lunch">0 kcal</span>
                            <span class="meal-arrow" id="arrow-lunch">▼</span>
                        </div>
                        <ul class="meal-list" id="list-lunch"></ul>
                    </div>

                    <div class="meal" id="meal-dinner">
                        <div class="meal-header" onclick="toggleMeal('dinner')">
                            <span>🌙 Dinner</span>
                            <span class="meal-kcal" id="kcal-dinner">0 kcal</span>
                            <span class="meal-arrow" id="arrow-dinner">▼</span>
                        </div>
                        <ul class="meal-list" id="list-dinner"></ul>
                    </div>
                </div>

                    <div class="weekly-chart">
                        <h2>This Week</h2>
                        <div class="chart-area">
                            <div class="goal-line"></div>
                            <div class="bars" id="bars">
                                <div class="bar-group">
                                    <div class="bar" id="bar-0"></div>
                                    <span>Mon</span>
                                </div>
                                <div class="bar-group">
                                    <div class="bar" id="bar-1"></div>
                                    <span>Tue</span>
                                </div>
                                <div class="bar-group">
                                    <div class="bar" id="bar-2"></div>
                                    <span>Wed</span>
                                </div>
                                <div class="bar-group">
                                    <div class="bar" id="bar-3"></div>
                                    <span>Thu</span>
                                </div>
                                <div class="bar-group">
                                    <div class="bar" id="bar-4"></div>
                                    <span>Fri</span>
                                </div>
                                <div class="bar-group">
                                    <div class="bar" id="bar-5"></div>
                                    <span>Sat</span>
                                </div>
                                <div class="bar-group">
                                    <div class="bar" id="bar-6"></div>
                                    <span>Sun</span>
                                </div>
                            </div>
                        </div>
                    </div>

                    <button id="add-food-btn">+ Analyze Food</button>
                </div>

                <div class="page" id="page-water">
                    <h1>Water Intake</h1>
                
                    <div class="water-container">
                        <div class="water-drop"> <div class="bottle-body"> <div class="water-fill" id="water-fill"></div>
                            <div class="water-fill" id="water-fill"></div>
                        </div>
                        <p class="water-text"><span id="glasses-drunk">0</span> / 8 glasses</p>
                    </div>

                    <button class="water-btn" id="add-water">+ Add Glass</button>
                    <button class="water-btn secondary" id="remove-water">- Remove Glass</button>
                </div>

            </div>

        </div>

        <div class="dots">
            <span class="dot active" id="dot-1"></span>
            <span class="dot" id="dot-2"></span>
        </div>


        <script src="script.js"></script>
    </body>
</html>
